@keyframes shade{0%,8%{fill-opacity:.10}28%{fill-opacity:.22}48%,80%{fill-opacity:.45}90%,100%{fill-opacity:.10}}
.lit{filter:drop-shadow(0 0 3px currentColor)}
.caret{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
.ping{animation:ping 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes ping{0%{transform:scale(.5);opacity:.9}100%{transform:scale(2.6);opacity:0}}
.spin{animation:spin 8s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes spin{to{transform:rotate(360deg)}}
.bob{animation:bob 4s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes ch00{0%{opacity:0}4.2%{opacity:0}5.4%{opacity:1}94.2%{opacity:1}95.4%{opacity:0}100%{opacity:0}}
@keyframes ch10{0%{opacity:0}9.2%{opacity:0}10.4%{opacity:1}94.2%{opacity:1}95.4%{opacity:0}100%{opacity:0}}
@keyframes ch21{0%{opacity:0}14.2%{opacity:0}15.4%{opacity:1}94.2%{opacity:1}95.4%{opacity:0}100%{opacity:0}}
@keyframes ch31{0%{opacity:0}19.2%{opacity:0}20.4%{opacity:1}94.2%{opacity:1}95.4%{opacity:0}100%{opacity:0}}
.gen{animation:gen 12s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes gen{0%{transform:scale(1)}25%{transform:scale(1)}26.3%{transform:scale(.92)}27.9%{transform:scale(1)}100%{transform:scale(1)}}
.q{animation:q 12s cubic-bezier(.3,1.3,.5,1) infinite}
@keyframes q{0%{opacity:0;transform:translateY(8px)}36.7%{opacity:0;transform:translateY(8px)}39.6%{opacity:1;transform:none}94.2%{opacity:1;transform:none}97.1%{opacity:0;transform:translateY(8px)}100%{opacity:0;transform:translateY(8px)}}
.beat{animation:beat .625s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes beat{0%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes viz{0%{opacity:0}38.3%{opacity:0}41.7%{opacity:1}94.2%{opacity:1}97.5%{opacity:0}100%{opacity:0}}
@keyframes ly0{0%{opacity:0}45%{opacity:0}46.7%{opacity:1}61.7%{opacity:1}63.3%{opacity:0}100%{opacity:0}}
@keyframes ly1{0%{opacity:0}61.7%{opacity:0}63.3%{opacity:1}78.3%{opacity:1}80%{opacity:0}100%{opacity:0}}
@keyframes ly2{0%{opacity:0}78.3%{opacity:0}80%{opacity:1}94.2%{opacity:1}95.8%{opacity:0}100%{opacity:0}}
.midi{animation:midi 12s cubic-bezier(.3,1.3,.5,1) infinite}
@keyframes midi{0%{opacity:0;transform:translateY(-14px)}71.7%{opacity:0;transform:translateY(-14px)}74.6%{opacity:1;transform:none}91.7%{opacity:1;transform:none}94.6%{opacity:0;transform:translateY(-14px)}100%{opacity:0;transform:translateY(-14px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
